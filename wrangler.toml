name = "telegram-ipa-signer-bot"
main = "src/index.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# Bindings for Cloudflare R2 Bucket
[[r2_buckets]]
binding = "IPA_BUCKET"
bucket_name = "ipa-storage"

# Environment Variables
# For sensitive values (TELEGRAM_BOT_TOKEN, GITHUB_TOKEN), 
# use `wrangler secret put <NAME>` instead of plain text here.
[vars]
GITHUB_REPO = "KeyToolSteamGame/telegram-ipa-signer-bot"
APP_URL = "https://telegram-ipa-signer-bot.chhunjp.workers.dev"
R2_ACCOUNT_ID = "d02ea3805efd909e0451459a19c09dd9"

